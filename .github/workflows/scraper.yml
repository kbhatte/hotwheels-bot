name: Hot Wheels Drop Tracker

on:
  schedule:
    # Every hour from 07:00 through 23:00 IST = 01:30 through 17:30 UTC.
    - cron: '30 1-17 * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

concurrency:
  group: hot-wheels-scraper
  cancel-in-progress: false

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the generated state file back to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Validate Required Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELIVERY_LATITUDE: ${{ secrets.DELIVERY_LATITUDE }}
          DELIVERY_LONGITUDE: ${{ secrets.DELIVERY_LONGITUDE }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Missing TELEGRAM_BOT_TOKEN secret"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Missing TELEGRAM_CHAT_ID secret"; exit 1; }
          test -n "$DELIVERY_LATITUDE" || { echo "::error::Missing DELIVERY_LATITUDE secret"; exit 1; }
          test -n "$DELIVERY_LONGITUDE" || { echo "::error::Missing DELIVERY_LONGITUDE secret"; exit 1; }

      - name: Run Hot Wheels Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELIVERY_LATITUDE: ${{ secrets.DELIVERY_LATITUDE }}
          DELIVERY_LONGITUDE: ${{ secrets.DELIVERY_LONGITUDE }}
          BLINKIT_HEADERS: ${{ secrets.BLINKIT_HEADERS }}
          BLINKIT_BODY: ${{ secrets.BLINKIT_BODY }}
          BLINKIT_SEARCH_URL: ${{ vars.BLINKIT_SEARCH_URL }}
          BLINKIT_METHOD: ${{ vars.BLINKIT_METHOD }}
          ZEPTO_HEADERS: ${{ secrets.ZEPTO_HEADERS }}
          INSTAMART_HEADERS: ${{ secrets.INSTAMART_HEADERS }}
          ZEPTO_BODY: ${{ secrets.ZEPTO_BODY }}
          INSTAMART_BODY: ${{ secrets.INSTAMART_BODY }}
          ZEPTO_SEARCH_URL: ${{ vars.ZEPTO_SEARCH_URL }}
          INSTAMART_SEARCH_URL: ${{ vars.INSTAMART_SEARCH_URL }}
          ZEPTO_METHOD: ${{ vars.ZEPTO_METHOD }}
          INSTAMART_METHOD: ${{ vars.INSTAMART_METHOD }}
        run: python hotwheels_bot.py

      - name: Save State (Commit seen items)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add listing_state.json
          # Only commit if the file has changed
          if git diff --staged --quiet; then
            echo "State file did not change."
            exit 0
          fi
          git commit -m "chore: update seen products state [skip ci]"
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            echo "Push attempt $attempt raced with another update; rebasing."
            git fetch origin main
            git rebase origin/main || {
              echo "State update conflicted with another run. Retry the workflow."
              git rebase --abort
              exit 1
            }
          done
          echo "Unable to push state after three attempts."
          exit 1
