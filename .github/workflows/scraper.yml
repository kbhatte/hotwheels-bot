name: Hot Wheels Drop Tracker

on:
  schedule:
    # Runs every hour (GitHub's cron uses UTC time)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to run it manually from the GitHub UI

concurrency:
  group: hot-wheels-scraper
  cancel-in-progress: false

jobs:
  scrape-and-alert:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit the seen_products.json back to the repo
    
    # Force the runner to use Node 24 for all actions to resolve deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Hot Wheels Tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLINKIT_HEADERS: ${{ secrets.BLINKIT_HEADERS }}
          ZEPTO_HEADERS: ${{ secrets.ZEPTO_HEADERS }}
          INSTAMART_HEADERS: ${{ secrets.INSTAMART_HEADERS }}
          ZEPTO_BODY: ${{ secrets.ZEPTO_BODY }}
          INSTAMART_BODY: ${{ secrets.INSTAMART_BODY }}
          ZEPTO_SEARCH_URL: ${{ vars.ZEPTO_SEARCH_URL }}
          INSTAMART_SEARCH_URL: ${{ vars.INSTAMART_SEARCH_URL }}
          ZEPTO_METHOD: ${{ vars.ZEPTO_METHOD }}
          INSTAMART_METHOD: ${{ vars.INSTAMART_METHOD }}
        run: python hotwheels_bot.py

      - name: Save State (Commit seen items)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add seen_products.json
          # Only commit if the file has changed
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update seen products state [skip ci]"
          git push
